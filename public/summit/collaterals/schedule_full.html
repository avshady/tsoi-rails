<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule to be announced soon — TSOI Summit 2026</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', Arial, sans-serif;
      background: #f0f0f5;
      color: #0a0a14;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
    }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ff2a7f; margin-bottom: 14px; }
    h1 { font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 14px; }
    p { font-size: 16px; line-height: 1.6; color: #52525f; margin-bottom: 28px; }
    a.btn {
      display: inline-block;
      background: #0a0a14;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 28px;
      border-radius: 100px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">The Schools of India Summit 2026</div>
    <h1>The full schedule will be announced soon.</h1>
    <p>Dates, the day-by-day programme and venue will be shared as soon as they are confirmed.</p>
    <a class="btn" href="/summit">Back to the Summit</a>
  </div>
</body>
</html>
